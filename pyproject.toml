[project]
name = "perfcast"
version = "0.1.0"
description = "Do LLM forecasters notice that their forecasts move the series?"
readme = "README.md"
authors = [{ name = "epistemics" }]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "httpx>=0.27",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.1", "ipykernel>=6.29"]

[project.scripts]
perfcast = "perfcast.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
